<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background-color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="background-color:#eff6ff;padding:24px 32px;border-bottom:1px solid #dbeafe;">
                <span style="font-size:18px;font-weight:700;color:#1d4ed8;">Common Notes</span>
                <div style="font-size:13px;color:#3b82f6;margin-top:2px;">Community Notes for Everything</div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 12px;font-size:20px;font-weight:700;color:#111827;">Confirm your email</h1>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#4b5563;">
                  You're one step away from voting on notes and suggesting improvements.
                  Enter this code where you asked to sign in:
                </p>
                <div style="padding:20px;background-color:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;text-align:center;">
                  <span style="display:inline-block;font-size:28px;font-weight:700;letter-spacing:8px;color:#111827;">{{ .Token }}</span>
                </div>
                <p style="margin:16px 0 0;font-size:13px;line-height:1.5;color:#6b7280;">
                  The code works once and expires shortly.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 24px;border-top:1px solid #f3f4f6;">
                <p style="margin:0;font-size:12px;line-height:1.5;color:#9ca3af;">
                  If you didn't request this, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
