# Throwaway probe for GOO-202. Delete before the PR is marked ready.
name: Probe GOO-202
on:
  push:
    branches: [fix/youtube-low-quality-format]
    paths: [.github/workflows/probe-goo-202.yml, src/scripts_jim/2026_09_29_youtube_frames_only/**]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YTDLP_PROXY_URL: ${{ secrets.YTDLP_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - name: Install FFmpeg and yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pipx install yt-dlp
          yt-dlp --version
      - run: bun run src/scripts_jim/2026_09_29_youtube_frames_only/probe.ts
