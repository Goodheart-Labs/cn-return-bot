name: Debug YouTube subtitles (GOO-169)

# Throwaway investigation workflow, third probe: is the residential proxy
# itself healthy? Plain HTTPS requests through it to YouTube and to an
# unrelated site, with timings and status codes, plus the proxy's own answer
# when it refuses.

on:
  push:
    branches: [sandbox/common-notes-bottleneck]
    paths: [.github/workflows/debug-yt-subs.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YTDLP_PROXY_URL: ${{ secrets.YTDLP_PROXY_URL }}
    steps:
      - name: Plain requests through the proxy
        run: |
          req() {
            echo "=================== $1"
            for i in 1 2 3; do
              curl -sS -o /tmp/body -x "$YTDLP_PROXY_URL" -m 40 -w "  status %{http_code}  connect %{time_connect}s  ttfb %{time_starttransfer}s  total %{time_total}s  bytes %{size_download}\n" "$1" 2>&1 | tail -2
              head -c 300 /tmp/body | tr '\n' ' ' | sed 's/[A-Za-z0-9+/=]\{40,\}/…/g'; echo
            done
          }
          req https://api.ipify.org
          req https://example.com/
          req https://www.youtube.com/
          req "https://www.youtube.com/feeds/videos.xml?channel_id=UCzQUP1qoWDoEbmsQxvdjxgQ"
          req "https://www.youtube.com/youtubei/v1/player?prettyPrint=false"
          echo "=================== proxy host reachability (no TLS to the target)"
          curl -sS -o /dev/null -x "$YTDLP_PROXY_URL" -m 40 -w "status %{http_code} total %{time_total}s\n" http://example.com/ 2>&1 | tail -2
