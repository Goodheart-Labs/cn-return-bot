name: Debug YouTube subtitles (GOO-169)

# Throwaway investigation workflow, sixth probe: does the web client with the
# PO token provider need a JavaScript runtime? Same call as the fourth probe
# but without deno.

on:
  push:
    branches: [sandbox/common-notes-bottleneck]
    paths: [.github/workflows/debug-yt-subs.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YTDLP_PROXY_URL: ${{ secrets.YTDLP_PROXY_URL }}
    steps:
      - run: pipx install yt-dlp && pipx inject yt-dlp bgutil-ytdlp-pot-provider && yt-dlp --version
      - run: docker run -d --name bgutil -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider && sleep 8 && curl -sS -m 20 http://127.0.0.1:4416/ping
      - name: web client, no JS runtime
        run: |
          for url in https://www.youtube.com/watch?v=J3SIbt2s28Y https://www.youtube.com/watch?v=r2ali4LgCQ8 https://www.youtube.com/watch?v=cuckk-vSE-Y; do
            echo "=================== $url"
            d=$(mktemp -d)
            time (yt-dlp --proxy "$YTDLP_PROXY_URL" --extractor-args "youtube:player_client=web" --write-subs --write-auto-subs --sub-lang "en.*" --skip-download --ignore-no-formats-error -o "$d/%(id)s.%(ext)s" "$url" 2>&1 | grep -i "WARNING\|ERROR\|Writing\|no subtitles\|PO Token\|runtime\|members" | cut -c1-170 | head -12)
            ls "$d"
          done
