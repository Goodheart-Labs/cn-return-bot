name: Debug YouTube subtitles (GOO-169)

# Throwaway investigation workflow, last use: the worker's own YouTube fetch,
# end to end, on videos that were recorded as having no transcript, with the
# setup action the feed workflow uses. Deleted before the PR is marked ready.

on:
  push:
    branches: [sandbox/common-notes-bottleneck]
    paths: [.github/workflows/debug-yt-subs.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YTDLP_PROXY_URL: ${{ secrets.YTDLP_PROXY_URL }}
      YOUTUBE_DATA_V3_API_KEY: ${{ secrets.YOUTUBE_DATA_V3_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - uses: ./.github/actions/setup-youtube-captions
      - name: The worker's own fetch, smoke run 2
        run: >
          bun run src/scripts_jim/2026_09_16_common_notes_bottleneck/captionSmoke.ts
          https://www.youtube.com/watch?v=J3SIbt2s28Y
          https://www.youtube.com/watch?v=r2ali4LgCQ8
          https://www.youtube.com/watch?v=QlF9o9IEp3c
          https://www.youtube.com/watch?v=NW4IgJKTsII
          https://www.youtube.com/watch?v=_7ARzqsVmTw
          https://www.youtube.com/watch?v=DP2m0zJL15I
          https://www.youtube.com/watch?v=cuckk-vSE-Y
