name: Debug YouTube subtitles (GOO-169)

# Throwaway investigation workflow, fourth probe. The web client sees the
# captions but discards them without a PO token; the other clients time out
# on the player API through the proxy. This runs yt-dlp with the bgutil PO
# token provider (a local Docker container yt-dlp asks for tokens) and the
# web client, through the proxy, and times it.

on:
  push:
    branches: [sandbox/common-notes-bottleneck]
    paths: [.github/workflows/debug-yt-subs.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YTDLP_PROXY_URL: ${{ secrets.YTDLP_PROXY_URL }}
      FAILING: https://www.youtube.com/watch?v=J3SIbt2s28Y
      WORKING: https://www.youtube.com/watch?v=DP2m0zJL15I
    steps:
      - run: pipx install yt-dlp && pipx inject yt-dlp bgutil-ytdlp-pot-provider && yt-dlp --version
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Start the PO token provider
        run: |
          docker run -d --name bgutil -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 8
          curl -sS -m 20 http://127.0.0.1:4416/ping; echo
      - name: Variants
        run: |
          probe() {
            echo "=================== $1 :: $2"
            shift; shift
            d=$(mktemp -d)
            time (yt-dlp --write-subs --write-auto-subs --sub-lang "en.*" --skip-download --ignore-no-formats-error -v -o "$d/%(id)s.%(ext)s" "$@" 2>&1 | grep -i "Downloading .* API JSON\|timed out\|Unable\|subtitle\|caption\|has no\|ERROR\|pot\b\|PO Token\|Sign in\|Writing" | cut -c1-170 | head -20)
            ls "$d" | head -3
          }
          for url in "$FAILING" "$WORKING"; do
            probe web-with-pot "$url" --proxy "$YTDLP_PROXY_URL" --extractor-args "youtube:player_client=web" "$url"
            probe default-with-pot "$url" --proxy "$YTDLP_PROXY_URL" "$url"
          done
          probe web-with-pot-list-subs "$FAILING" --proxy "$YTDLP_PROXY_URL" --extractor-args "youtube:player_client=web" --list-subs "$FAILING"
          docker logs bgutil 2>&1 | tail -5
