name: Debug YouTube subtitles (GOO-169)

# Throwaway investigation workflow, fifth probe: the walk's own channel
# listing command, verbose, through the proxy and without it, and the channel
# RSS feed both ways, each several times with timings.

on:
  push:
    branches: [sandbox/common-notes-bottleneck]
    paths: [.github/workflows/debug-yt-subs.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YTDLP_PROXY_URL: ${{ secrets.YTDLP_PROXY_URL }}
    steps:
      - run: pipx install yt-dlp && yt-dlp --version
      - name: Walk listing, verbose
        run: |
          listing() {
            echo "=================== $1 :: $2"
            shift; shift
            time (yt-dlp "$@" --flat-playlist --playlist-items 1:15 -v --print "%(id)s" --print "playlist:%(channel_id)s" 2>&1 | grep -i "Downloading\|Retrying\|timed out\|ERROR\|Unable\|SSL\|^UC" | cut -c1-150 | head -12)
          }
          for ch in joerogan LilAggy Channel5YouTube; do
            for i in 1 2; do listing "proxy $i" "$ch" --proxy "$YTDLP_PROXY_URL" "https://www.youtube.com/@$ch/videos"; done
            listing "direct" "$ch" "https://www.youtube.com/@$ch/videos"
          done
      - name: Channel RSS feed
        run: |
          for i in 1 2 3; do
            curl -sS -o /dev/null -m 30 -w "direct  status %{http_code} total %{time_total}s\n" "https://www.youtube.com/feeds/videos.xml?channel_id=UCx_Qyb3447P9bBaT4o8QSjQ"
            curl -sS -o /dev/null -m 30 -x "$YTDLP_PROXY_URL" -w "proxied status %{http_code} total %{time_total}s\n" "https://www.youtube.com/feeds/videos.xml?channel_id=UCx_Qyb3447P9bBaT4o8QSjQ"
          done
