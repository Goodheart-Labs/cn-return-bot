name: Debug YouTube subtitles (GOO-169)

# Throwaway investigation workflow, second probe. The first probe showed that
# every per-video call through the proxy times out on YouTube's player API
# and then reports "no subtitles". This one tries the same video with a JS
# runtime installed, with other player clients, with a longer socket timeout,
# and without the proxy, to find which change makes the call succeed.

on:
  push:
    branches: [sandbox/common-notes-bottleneck]
    paths: [.github/workflows/debug-yt-subs.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YTDLP_PROXY_URL: ${{ secrets.YTDLP_PROXY_URL }}
      FAILING: https://www.youtube.com/watch?v=J3SIbt2s28Y
      WORKING: https://www.youtube.com/watch?v=DP2m0zJL15I
    steps:
      - run: pipx install yt-dlp && yt-dlp --version
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Variants
        run: |
          probe() {
            echo "=================== $1 :: $2"
            shift; shift
            d=$(mktemp -d)
            time (yt-dlp --write-subs --write-auto-subs --sub-lang "en.*" --skip-download --ignore-no-formats-error -v -o "$d/%(id)s.%(ext)s" "$@" 2>&1 | grep -i "Downloading .* API JSON\|timed out\|Unable\|subtitle\|caption\|has no\|ERROR\|player_client\|Sign in\|bot\|js runtime\|deno" | cut -c1-160 | head -20)
            ls "$d" | head -3
          }
          for url in "$FAILING" "$WORKING"; do
            probe default-with-deno "$url" --proxy "$YTDLP_PROXY_URL" "$url"
            probe socket-timeout-60 "$url" --proxy "$YTDLP_PROXY_URL" --socket-timeout 60 "$url"
            probe client-web "$url" --proxy "$YTDLP_PROXY_URL" --extractor-args "youtube:player_client=web" "$url"
            probe client-tv "$url" --proxy "$YTDLP_PROXY_URL" --extractor-args "youtube:player_client=tv" "$url"
            probe client-android "$url" --proxy "$YTDLP_PROXY_URL" --extractor-args "youtube:player_client=android" "$url"
            probe no-proxy "$url" "$url"
          done
