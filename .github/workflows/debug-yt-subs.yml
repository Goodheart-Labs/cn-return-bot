name: Debug YouTube subtitles (GOO-169)

# Throwaway investigation workflow, last use: run the worker's own YouTube
# fetch end to end on six of the videos that were recorded as having no
# transcript, with the setup the feed workflow now uses. Deleted before the
# PR is marked ready.

on:
  push:
    branches: [sandbox/common-notes-bottleneck]
    paths: [.github/workflows/debug-yt-subs.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YTDLP_PROXY_URL: ${{ secrets.YTDLP_PROXY_URL }}
      YOUTUBE_DATA_V3_API_KEY: ${{ secrets.YOUTUBE_DATA_V3_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - uses: ./.github/actions/setup-youtube-captions
      - name: Same command from a shell
        run: |
          d=$(mktemp -d)
          time (yt-dlp --proxy "$YTDLP_PROXY_URL" --extractor-args "youtube:player_client=web" --write-subs --write-auto-subs --sub-lang "en.*" --skip-download --ignore-no-formats-error -o "$d/%(id)s.%(ext)s" https://www.youtube.com/watch?v=J3SIbt2s28Y 2>&1 | tail -6)
          ls "$d"
      - name: Same command through spawnSync
        run: bun run src/scripts_jim/2026_09_16_common_notes_bottleneck/captionSpawnDebug.ts https://www.youtube.com/watch?v=J3SIbt2s28Y
      - name: The worker's own fetch
        run: >
          bun run src/scripts_jim/2026_09_16_common_notes_bottleneck/captionSmoke.ts
          https://www.youtube.com/watch?v=J3SIbt2s28Y
          https://www.youtube.com/watch?v=r2ali4LgCQ8
          https://www.youtube.com/watch?v=cuckk-vSE-Y
