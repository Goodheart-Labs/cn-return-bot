name: Tests

# Type-checks the three TypeScript projects, lints the Common Notes frontend,
# looks for unused code with knip and runs the repo's unit tests (bun test
# discovers every *.test.ts) on each PR and on main, so a regression goes red
# before it merges.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type-check the bot, the review dashboard and the extension
        run: bun run typecheck && bun run typecheck-review && bun run typecheck-ext

      - name: Lint the Common Notes frontend
        run: bun run lint

      - name: Look for unused files, exports and dependencies
        run: bunx knip

      # The extension's tsconfig extends the one WXT generates into the
      # gitignored .wxt folder, and that file maps the @cn/* imports. Without
      # it, bun test cannot resolve them in the extension's tests.
      - name: Generate the extension's TypeScript config
        run: cd src/everything-extension && bunx wxt prepare

      - name: Run unit tests
        run: bun test
