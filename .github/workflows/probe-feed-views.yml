# Throwaway probe for GOO-834: runs the feed view recorder's dry run with the
# production notewriter keys, twice, five minutes apart. Deleted before the PR
# is marked ready.
name: Probe feed views
on:
  push:
    branches: [sandbox/tweet-views-prediction]
    paths: [.github/workflows/probe-feed-views.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - name: Two dry-run walks
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          bun run src/feed-views/main.ts --dry-run
          sleep 300
          bun run src/feed-views/main.ts --dry-run
