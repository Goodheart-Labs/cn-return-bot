name: Evaluate Note Probe
# One-off diagnostic: call X's evaluate_note from the Actions environment with the
# repository's writer secrets and print the full response, so a 403 shows its reason.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Call evaluate_note and print the response
        run: |
          bun -e '
          import axios from "axios";
          const { getOAuth1Headers } = await import("./src/api/getOAuthToken");
          const url = "https://api.x.com/2/evaluate_note";
          const data = { post_id: "2100611075922149739", note_text: "Robert Iler is 41; Dominic Chianese was 67 when The Sopranos premiered in 1999. https://en.wikipedia.org/wiki/Robert_Iler" };
          const body = JSON.stringify(data);
          try {
            const r = await axios.post(url, data, { headers: { ...getOAuth1Headers(url, "POST", body), "Content-Type": "application/json" }, timeout: 30000 });
            console.log("status", r.status, JSON.stringify(r.data));
          } catch (e) {
            console.log("status", e.response?.status, "headers", JSON.stringify(e.response?.headers ?? {}));
            console.log("body", JSON.stringify(e.response?.data ?? e.message));
          }
          const me = "https://api.x.com/2/users/me";
          try { const r = await axios.get(me, { headers: getOAuth1Headers(me, "GET"), timeout: 20000 }); console.log("users/me", r.status, JSON.stringify(r.data)); }
          catch (e) { console.log("users/me", e.response?.status, JSON.stringify(e.response?.data ?? e.message)); }
          '
