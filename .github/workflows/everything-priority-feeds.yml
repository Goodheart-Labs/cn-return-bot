name: Everything Priority Feeds

# BRANCH-ONLY DIAGNOSTIC (GOO-21): does a failing video really have no English
# captions, or does the proxy IP get a degraded player response that omits
# them? This replaces the pipeline with a yt-dlp caption probe on this branch.
# Never merge this to main.
on:
  workflow_dispatch:

# A different group from production, because this probe runs no worker and must
# not queue behind or delay the real dispatch ticks.
concurrency:
  group: everything-priority-feeds-caption-probe
  cancel-in-progress: false

jobs:
  enqueue-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YTDLP_PROXY_URL: ${{ secrets.YTDLP_PROXY_URL }}
    steps:
      - name: Install yt-dlp
        run: pipx install yt-dlp && yt-dlp --version

      - name: Probe caption availability through the proxy
        run: |
          # DgeRVUSuGvQ / EdhbPHjzdU8 / pXVmkurTOgM: Hank Green videos parked as
          # "No en transcript available". IabDOXf7Acs: same for MoneyMacro.
          # DoXvZtfrLns: a MoneyMacro video that processed fine, as a control.
          for id in DgeRVUSuGvQ EdhbPHjzdU8 pXVmkurTOgM IabDOXf7Acs DoXvZtfrLns; do
            for attempt in 1 2; do
              echo "=== $id attempt $attempt ==="
              timeout 150 yt-dlp --proxy "$YTDLP_PROXY_URL" --list-subs --skip-download \
                --ignore-no-formats-error --no-warnings --socket-timeout 20 \
                "https://www.youtube.com/watch?v=$id" > subs.txt 2> err.txt
              echo "exit=$?"
              echo "--- available subtitle languages (grep en) ---"
              grep -E "^en|Available (automatic captions|subtitles)|has no " subs.txt | head -8 || echo "(no caption lines)"
              echo "--- stderr ---"
              head -c 500 err.txt; echo
            done
          done
