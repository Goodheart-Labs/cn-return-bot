name: Everything Priority Feeds

# BRANCH-ONLY DIAGNOSTIC (GOO-21): the first probe said the parked videos report
# no captions at all. That alone does not settle it, because a flagged proxy IP
# is served a stripped player response that also reports no captions. So this
# run tests known-good controls in the same session: videos whose captions the
# pipeline successfully read a few days ago. If the controls still show captions
# and the parked ones do not, the parked videos genuinely have none.
# Never merge this to main.
on:
  workflow_dispatch:

concurrency:
  group: everything-priority-feeds-caption-probe
  cancel-in-progress: false

jobs:
  enqueue-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YTDLP_PROXY_URL: ${{ secrets.YTDLP_PROXY_URL }}
    steps:
      - name: Install yt-dlp
        run: pipx install yt-dlp && yt-dlp --version

      - name: Probe caption availability through the proxy
        # A single timeout must not abort the whole probe, which is what cut the
        # previous run short.
        continue-on-error: true
        run: |
          set +e
          # Controls first: DoXvZtfrLns (MoneyMacro) and 47IWmZUDxqc (Hank Green)
          # both had their captions read successfully by the pipeline on Aug 17-20.
          # Then the parked ones: IabDOXf7Acs (MoneyMacro), DgeRVUSuGvQ (Hank).
          for id in DoXvZtfrLns 47IWmZUDxqc IabDOXf7Acs DgeRVUSuGvQ; do
            echo "=== $id ==="
            timeout 120 yt-dlp --proxy "$YTDLP_PROXY_URL" --list-subs --skip-download \
              --ignore-no-formats-error --socket-timeout 20 \
              "https://www.youtube.com/watch?v=$id" > subs.txt 2> err.txt
            echo "exit=$?"
            grep -cE "^en" subs.txt | sed 's/^/english caption tracks: /'
            grep -E "has no (automatic captions|subtitles)|Available (automatic captions|subtitles)" subs.txt | head -4
            echo "--- stderr (first 300 bytes) ---"
            head -c 300 err.txt; echo
          done
