name: Backfill YouTube Timestamps

# One-off maintenance run (GOO-52): recompute start/end seconds for noted
# YouTube claims that were saved without a timestamp, so the extension can pin
# their notes on the player. Runs here rather than locally because subtitle
# fetches need the residential yt-dlp proxy — YouTube bot-checks other IPs.

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      YTDLP_PROXY_URL: ${{ secrets.YTDLP_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install yt-dlp
        run: pipx install yt-dlp && yt-dlp --version

      - name: Backfill claim timestamps
        run: bun run src/scripts_jim/2026_08_26_youtube_pin_backfill/backfill.ts
