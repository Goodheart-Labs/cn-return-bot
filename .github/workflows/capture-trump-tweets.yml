name: Capture Trump Election-Fraud Tweets

# Standalone CAPTURE ONLY. Reads the eligible feed with the prod X secrets,
# saves tweets matching the trump_election_fraud predicate as an artifact.
# It does NOT register a topic in the note-writer, so nothing is drafted or
# posted — read + save only. Safe on main.
#
# Manual (workflow_dispatch) for verification; hourly schedule for ongoing
# capture (schedule fires only on the default branch).
on:
  workflow_dispatch:
    inputs:
      feed_size:
        description: "Feed size"
        type: choice
        default: xxl
        options: [xxl, xl, large, small]
      max_pages:
        description: "Max pages (100 posts/page)"
        type: string
        default: "100"
  schedule:
    - cron: "0 * * * *" # hourly

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      OUT_DIR: capture-out
      FEED_SIZE: ${{ inputs.feed_size || 'xxl' }}
      MAX_PAGES: ${{ inputs.max_pages || '100' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - name: Capture
        run: |
          export RUN_STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          bun run src/scripts_jim/2026_07_18_trump_capture/capture.ts
      - name: Show summary
        if: always()
        run: cat capture-out/*.summary.json || echo "no summary"
      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trump-capture
          path: capture-out/
          if-no-files-found: warn
