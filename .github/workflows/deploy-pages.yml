name: Deploy Pages

# GitHub Pages gets the stats dashboard at /cn-return-bot/, and the cron
# refresh renews its snapshot. The Common Notes analytics live on the
# website's admin dashboard at commonnotes.net/admin/dashboard since GOO-564.
#
# The Common Notes website lives only on commonnotes.net. Every merge to main
# builds it and deploys it to Cloudflare Pages, and so does a run started by
# hand. The four-hourly run leaves it alone, because the code has not changed.
#
# A merge runs this workflow whatever it touched. A list of the website's
# folders would miss the next shared folder someone adds, and the site would
# then go stale without anyone noticing.

on:
  schedule:
    # Refresh the stats snapshot every 4 hours.
    - cron: "0 */4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Snapshot Supabase to stats-data.json
        run: bun run build-stats-data

      - name: Build stats SPA
        run: cd src/stats-dashboard && bunx vite build
        env:
          BASE_PATH: /cn-return-bot/

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r src/stats-dashboard/dist/. site/

      - name: Build the Common Notes website
        if: github.event_name != 'schedule'
        run: cd src/everything-web && bunx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy commonnotes.net (Cloudflare Pages)
        # Until 2026-10-16 only a run started by hand deployed the site (Nathan,
        # 2026-07-10). Jim changed that, so merged work reaches readers at once.
        if: github.event_name != 'schedule'
        run: bunx wrangler pages deploy src/everything-web/dist --project-name=commonnotes --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
