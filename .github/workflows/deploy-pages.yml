name: Deploy Pages

# One artifact, two SPAs: the stats dashboard at /cn-return-bot/ and the
# "Community Notes on Everything" site at /cn-return-bot/notes/. The cron
# refresh only matters for the stats snapshot — the notes site reads Supabase
# live (anon key baked into the build, locked down by migration 050).

on:
  schedule:
    # Refresh the stats snapshot every 4 hours.
    - cron: "0 */4 * * *"
  push:
    branches: [main]
    paths:
      - "src/stats-dashboard/**"
      - "src/everything-web/**"
      - "src/dashboard-shared/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Snapshot Supabase to stats-data.json
        run: bun run build-stats-data

      - name: Build stats SPA
        run: cd src/stats-dashboard && bunx vite build
        env:
          BASE_PATH: /cn-return-bot/

      - name: Build everything SPA
        run: cd src/everything-web && bunx vite build
        env:
          BASE_PATH: /cn-return-bot/notes/
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Assemble site
        run: |
          mkdir -p site/notes
          cp -r src/stats-dashboard/dist/. site/
          cp -r src/everything-web/dist/. site/notes/

      - name: Build everything SPA at root path (commonnotes.net)
        run: cd src/everything-web && bunx vite build
        env:
          BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy commonnotes.net (Cloudflare Pages)
        run: bunx wrangler pages deploy src/everything-web/dist --project-name=commonnotes --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
