name: Deploy Pages

# Builds the Common Notes website and deploys it to Cloudflare Pages, which
# serves commonnotes.net. Every merge to main runs it, and so does a run
# started by hand.
#
# A merge runs this workflow whatever it touched. A list of the website's
# folders would miss the next shared folder someone adds, and the site would
# then go stale without anyone noticing.
#
# GitHub Pages has its own workflow, github-pages-notice.yml. Until GOO-888
# this one also published the stats dashboard there.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build the Common Notes website
        run: cd src/everything-web && bunx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy commonnotes.net (Cloudflare Pages)
        # Until 2026-10-16 only a run started by hand deployed the site (Nathan,
        # 2026-07-10). Jim changed that, so merged work reaches readers at once.
        # wrangler is not a dependency of the repo, so bunx downloads it here.
        # The exact version keeps a newly published release out of the step
        # that holds the Cloudflare token.
        run: bunx wrangler@4.151.0 pages deploy src/everything-web/dist --project-name=commonnotes --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
