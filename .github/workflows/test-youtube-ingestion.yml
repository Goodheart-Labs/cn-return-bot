name: Test YouTube Ingestion

# Temporary verification workflow: checks that the yt-dlp installed the same
# way as in everything-priority-feeds.yml can list a channel and fetch a
# video's metadata and transcript cues from a GitHub runner. Delete together
# with src/everything/debug/testYoutubeIngestion.ts once verified.
on:
  workflow_dispatch:

jobs:
  test-youtube-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install FFmpeg and yt-dlp (same as everything-priority-feeds.yml)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pipx install yt-dlp
          yt-dlp --version

      # yt-dlp needs a JavaScript runtime to solve YouTube's player challenges.
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The community solution for datacenter IPs: a local server that mints the
      # PO tokens YouTube demands, picked up by a yt-dlp plugin automatically.
      - name: Start the bgutil PO token provider
        run: |
          docker run -d --name bgutil-provider -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          pipx inject yt-dlp bgutil-ytdlp-pot-provider
          sleep 10

      # YouTube's bot check blocks video fetches from datacenter IPs. Try every
      # player client to see which, if any, gets metadata and subtitles through.
      - name: Try player-client strategies against the bot check
        run: |
          VIDEO="https://www.youtube.com/watch?v=oZBGAuANX6I"
          try() {
            local name="$1"; shift
            echo "=== $name"
            rm -rf /tmp/subs && mkdir -p /tmp/subs
            if yt-dlp --no-warnings --skip-download --print "%(title)s" "$@" "$VIDEO" > /tmp/meta.out 2>/tmp/meta.err; then
              echo "meta: PASS ($(cat /tmp/meta.out))"
            else
              echo "meta: FAIL ($(tail -1 /tmp/meta.err))"
            fi
            if yt-dlp --no-warnings --write-subs --write-auto-subs --sub-lang en --skip-download -o "/tmp/subs/%(id)s.%(ext)s" "$@" "$VIDEO" >/dev/null 2>/tmp/subs.err && ls /tmp/subs/* >/dev/null 2>&1; then
              echo "subs: PASS ($(ls /tmp/subs))"
            else
              echo "subs: FAIL ($(tail -1 /tmp/subs.err))"
            fi
          }
          try "default" --extractor-args "youtube:fetch_pot=always"
          try "web" --extractor-args "youtube:player_client=web;fetch_pot=always"
          try "mweb" --extractor-args "youtube:player_client=mweb;fetch_pot=always"
          try "tv" --extractor-args "youtube:player_client=tv;fetch_pot=always"
          try "web_embedded" --extractor-args "youtube:player_client=web_embedded;fetch_pot=always"

      - name: Verbose run to see PO token and challenge activity
        if: always()
        run: |
          yt-dlp -v --extractor-args "youtube:pot_trace=true;fetch_pot=always" --skip-download --print "%(title)s" "https://www.youtube.com/watch?v=oZBGAuANX6I" 2>&1 | tail -60 || true
          echo "=== provider logs"
          docker logs bgutil-provider 2>&1 | tail -20

      - name: List channel and fetch one video's metadata and cues
        run: bun run src/everything/debug/testYoutubeIngestion.ts
