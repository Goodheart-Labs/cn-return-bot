name: Create Notes Routine

on:
  workflow_dispatch:

# Triggered solely by Supabase pg_cron (every 30 min) via workflow_dispatch —
# GitHub's own scheduler dropped/delayed runs, so it was removed. See
# migrations/047_schedule_create_notes_dispatch.sql.
#
# Never run two pipelines at once. Runs normally finish within the 27-min
# in-process watchdog, but setup + a slow shutdown can occasionally spill past a
# dispatch tick. Queue (don't cancel) so a run is never killed mid
# note-submission.
concurrency:
  group: create-notes-routine
  cancel-in-progress: false

jobs:
  fetch-and-submit:
    runs-on: ubuntu-latest
    # Above the 27-min in-process watchdog plus the multi-minute setup steps, so
    # the watchdog (clean exit), not the runner kill, is the normal stop.
    timeout-minutes: 35
    env:
      # X API OAuth 1.0a credentials
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      # OpenRouter API key for AI models
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Supabase credentials for data storage
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Groq API key for Whisper audio transcription (video analysis)
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # xAI API key for Grok X search
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      # Gemini API key for native Gemini search/writer variants
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Brave Search API key — paid fallback provider in the SearXNG cycle
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      # Pangram AI-text-detection key for the XXL-feed pre-pass
      PANGRAM_API_KEY: ${{ secrets.PANGRAM_API_KEY }}
      # SearXNG instance running as a Docker container (see "Start SearXNG" step)
      SEARXNG_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SearXNG
        run: |
          docker run -d --name searxng \
            -p 8080:8080 \
            -v "${{ github.workspace }}/.github/searxng:/etc/searxng:ro" \
            searxng/searxng:latest
          for i in {1..30}; do
            if curl -sf "http://localhost:8080/search?q=test&format=json" > /dev/null; then
              echo "SearXNG is ready"
              exit 0
            fi
            sleep 2
          done
          echo "SearXNG failed to start"
          docker logs searxng || true
          exit 1

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install FFmpeg, yt-dlp, and gallery-dl for media analysis
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg yt-dlp gallery-dl

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Run pipeline (generate + submit candidates)
        run: bun run src/production/runPipeline.ts
