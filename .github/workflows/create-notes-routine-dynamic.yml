name: Create Notes Routine

on:
  schedule:
    - cron: "*/15 * * * *" # Runs every 15 minutes
  workflow_dispatch:

jobs:
  fetch-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # X API OAuth 1.0a credentials
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      # OpenRouter API key for AI models
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Supabase credentials for data storage
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Groq API key for Whisper audio transcription (video analysis)
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # xAI API key for Grok X search
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      # Gemini API key for native Gemini search/writer variants
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # SearXNG instance running as a Docker container (see "Start SearXNG" step)
      SEARXNG_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SearXNG
        run: |
          docker run -d --name searxng \
            -p 8080:8080 \
            -v "${{ github.workspace }}/.github/searxng:/etc/searxng:ro" \
            searxng/searxng:latest
          for i in {1..30}; do
            if curl -sf "http://localhost:8080/search?q=test&format=json" > /dev/null; then
              echo "SearXNG is ready"
              exit 0
            fi
            sleep 2
          done
          echo "SearXNG failed to start"
          docker logs searxng || true
          exit 1

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install FFmpeg and yt-dlp for video analysis
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg yt-dlp

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Run pipeline (generate + submit candidates)
        run: bun run src/production/runPipeline.ts
