name: Trending Posts

# Once a day, posts to Slack's #trending-posts the X posts about an article or
# blog post that went viral in Nathan Young's crowd the previous UTC day
# (src/production/postTrendingPosts.ts). Noon UTC gives yesterday's late posts
# at least 12 hours to gather likes.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  trending-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_TRENDING_POSTS_CHANNEL_ID: C0C5XD2G0DR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Post yesterday's trending posts
        run: bun run trending-posts
