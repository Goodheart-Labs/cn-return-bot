# Throwaway probe for GOO-549. Delete before the PR is marked ready.
name: Probe Substack relay age
on:
  push:
    branches: [sandbox/post-processing-delay]
    paths: [.github/workflows/probe-relay-age.yml, src/scripts_jim/2026_10_23_post_processing_delay/relayAge.ts]
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SUBSTACK_PROXY_URL: ${{ secrets.SUBSTACK_PROXY_URL }}
      SUBSTACK_PROXY_KEY: ${{ secrets.SUBSTACK_PROXY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun run src/scripts_jim/2026_10_23_post_processing_delay/relayAge.ts
