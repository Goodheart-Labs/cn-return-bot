name: Deploy Services

# Every push to main lands on the services machine: reset the checkout to the
# pushed commit, install, restart the three units. Bun runs TypeScript
# directly, so there is no build step. The machine's setup and environment file
# are documented in ops/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-service
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SERVICE_SSH_HOST }}
          SSH_KEY: ${{ secrets.SERVICE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "cnbot@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/cn-return-bot
          git fetch origin main
          git reset --hard "${{ github.sha }}"
          ~/.bun/bin/bun install --frozen-lockfile
          sudo systemctl restart cn-claim-check
          sudo systemctl restart cn-extraction
          sudo systemctl restart cn-intake
          REMOTE
