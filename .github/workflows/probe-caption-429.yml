name: Probe caption 429 (GOO-276, delete before merge)

on:
  push:
    branches: [fix/youtube-caption-429]
    paths: [.github/workflows/probe-caption-429.yml, src/scripts_jim/2026_09_30_youtube_caption_429/**, src/pipeline/media/youtubeCaptions.ts]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YTDLP_PROXY_URL: ${{ secrets.YTDLP_PROXY_URL }}
      YOUTUBE_DATA_V3_API_KEY: ${{ secrets.YOUTUBE_DATA_V3_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - uses: ./.github/actions/setup-youtube-captions
      - name: Fetch captions with the new code
        run: bun run src/scripts_jim/2026_09_30_youtube_caption_429/tryCaptions.ts
