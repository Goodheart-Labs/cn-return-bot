name: Set up YouTube caption downloads
description: >
  Installs what a caption download from YouTube needs: yt-dlp with the bgutil
  PO token plugin, the deno runtime yt-dlp solves YouTube's JavaScript
  challenges with, and the token provider itself as a local container.

# Why all three (GOO-169). yt-dlp downloads captions as YouTube's web player.
# That player must present a PO token, a proof that the request comes from a
# real player, or YouTube lists the captions and refuses to hand them over.
# The plugin makes yt-dlp ask the provider at 127.0.0.1:4416 for one. Without
# deno the same call spent ten minutes failing to get a token. Every other
# yt-dlp client times out on YouTube's internal API through the residential
# proxy, which for two days was recorded as "No transcript available".
#
# The plugin and the provider must be the same version.

runs:
  using: composite
  steps:
    - name: Install yt-dlp and the PO token plugin
      shell: bash
      # Ubuntu's packaged yt-dlp is years old and silently returns nothing on
      # today's YouTube, so the current release comes from PyPI.
      run: |
        pipx install yt-dlp
        pipx inject yt-dlp bgutil-ytdlp-pot-provider==2.0.0
        yt-dlp --version
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
    - name: Start the PO token provider
      shell: bash
      run: |
        docker run -d --name pot-provider -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:2.0.0
        # The provider answers its ping a few seconds after the container
        # starts. A run without it would record every video as unreachable,
        # so failing here is the right outcome.
        for attempt in $(seq 1 20); do
          curl -fsS -m 5 http://127.0.0.1:4416/ping && exit 0
          sleep 2
        done
        echo "The PO token provider did not come up"; docker logs pot-provider; exit 1
