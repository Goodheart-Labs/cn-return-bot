<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Common Notes — Community Notes on everything</title>
  <meta name="description" content="AI-written community notes on podcasts, newsletters, and beyond. Read freely; sign in to rate notes or suggest better ones." />
  <meta property="og:title" content="Common Notes" />
  <meta property="og:description" content="Community Notes everywhere: podcasts, newsletters, and beyond. In alpha, but voting works." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://commonnotes.net/" />
  <meta property="og:image" content="https://commonnotes.net/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://commonnotes.net/og.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* X/Twitter's stack verbatim. TwitterChirp is X's proprietary webfont, so in
     * practice this resolves to the system font — same as what X shows anyone
     * without Chirp installed. X differentiates headings from content by weight
     * (800 vs 400) and size within this one family, never by switching family;
     * headings carry font-extrabold in markup for that. */
    body { font-family: TwitterChirp, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    @keyframes cn-countdown { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 44; } }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
