<!DOCTYPE html>
<!-- bg-surface on <html>: scrolling past the top of the page shows the root
     element's background, and a page loads at its top, below the header.
     OverscrollColor takes over once the page runs, and sets the colour at
     whichever edge of the window the reader is nearer. -->
<html lang="en" class="cn-reading-scale bg-surface">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Common Notes: Community Notes on everything</title>
  <meta name="description" content="AI-written community notes on podcasts, newsletters, and beyond. Read freely; sign in to rate notes or suggest better ones." />
  <meta property="og:title" content="Common Notes" />
  <meta property="og:description" content="Community Notes everywhere: podcasts, newsletters, and beyond. In alpha, but voting works." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://commonnotes.net/" />
  <meta property="og:image" content="https://commonnotes.net/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://commonnotes.net/og.png" />
  <!-- The icon, white notes on a blue tile, and PNGs for browsers and home
       screens that take no SVG. A tab strip can be any grey, which plain blue
       notes vanish on. Vite copies each file into the build and rewrites these
       addresses. scripts/generate-logo-assets.ts draws all three. -->
  <link rel="icon" type="image/svg+xml" href="./src/assets/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="./src/assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" />
  <script>
    /* Applied before first paint so a dark system never flashes a light page.
     * SystemTheme keeps the class in sync with live OS theme changes. */
    if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
    /* Safari does not colour the area its trackpad bounce reveals past the
     * top or bottom of the page the way Chrome does (see OverscrollColor), and
     * shows black there. So Safari does not bounce at all. Chrome, Edge and
     * Firefox name Safari in their user agents too, hence the exclusions. */
    if (/safari/i.test(navigator.userAgent) && !/chrome|chromium|crios|fxios|edg|android/i.test(navigator.userAgent)) {
      document.documentElement.classList.add("overscroll-y-none");
    }
  </script>
</head>
<body class="bg-canvas text-fg font-sans min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
