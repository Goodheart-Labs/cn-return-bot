<!DOCTYPE html>
<!-- bg-surface on <html>: scrolling past the top of the page shows the root
     element's background, and a page loads at its top, below the header.
     OverscrollColor switches it as the reader scrolls. -->
<html lang="en" class="cn-reading-scale bg-surface">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Common Notes: Community Notes on everything</title>
  <meta name="description" content="AI-written community notes on podcasts, newsletters, and beyond. Read freely; sign in to rate notes or suggest better ones." />
  <meta property="og:title" content="Common Notes" />
  <meta property="og:description" content="Community Notes everywhere: podcasts, newsletters, and beyond. In alpha, but voting works." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://commonnotes.net/" />
  <meta property="og:image" content="https://commonnotes.net/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://commonnotes.net/og.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" />
  <script>
    /* Applied before first paint so a dark system never flashes a light page.
     * SystemTheme keeps the class in sync with live OS theme changes. */
    if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
  </script>
</head>
<body class="bg-canvas text-fg font-sans min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
