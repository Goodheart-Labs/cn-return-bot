<!DOCTYPE html>
<html>
<head>
<!-- The link preview card that og:image points at. scripts/generate-logo-assets.ts
     renders it, so run that script after changing this file.
     Slack's small preview shows only the middle square of the card, x 285 to 915,
     at about 120 pixels on screen. So the logo, the name and the headline sit in
     one centred stack no wider than 560 pixels, and are large enough to read
     there. Design and crop rules: src/scripts_jim/2026_10_06_link_preview_explorer/. -->
<meta charset="utf-8">
<!-- The website draws with the system font. A rendered card must look the same
     on every machine, so it uses Inter, which is close to Apple's SF Pro. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=block">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #ffffff;
    font-family: Inter, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  img { width: 168px; height: 168px; margin-bottom: 18px; }
  h1 { font-size: 76px; font-weight: 800; letter-spacing: -2px; line-height: 1; color: #111827; }
  .headline { margin-top: 22px; font-size: 34px; font-weight: 500; color: #4b5563; letter-spacing: -0.3px; }
  .site { margin-top: 30px; font-size: 26px; font-weight: 700; color: #2563eb; }
</style>
</head>
<body>
  <img src="../everything-ui/assets/logo.svg" alt="">
  <h1>Common Notes</h1>
  <div class="headline">Community Notes 4 Everything</div>
  <div class="site">commonnotes.net</div>
</body>
</html>
