<title>GPT-6.1 Terra Note Trial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: one reading column; a results table first, then one section per post
   whose text opens in place, with a note panel beside it on wide screens. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #1b2330; --muted: #5b6676; --line: #dde1e7;
  --accent: #2357c6;
  --existing: #ffe28a; --existing-strong: #c79500;
  --gpt: #2357c6;
  --good: #1f8a4c; --unsure: #a56a00; --bad: #c0392b; --found: #2357c6;
  --font-ui: "IBM Plex Sans", system-ui, sans-serif;
  --font-read: "Literata", Georgia, serif;
  --font-num: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --surface: #1a2029; --fg: #e3e7ee; --muted: #9aa5b5; --line: #2c3440;
  --accent: #7ea6ff; --existing: #5c4a0f; --existing-strong: #e6b93b; --gpt: #7ea6ff;
  --good: #55c486; --unsure: #e0a73a; --bad: #ef6f62; --found: #7ea6ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --fg: #e3e7ee; --muted: #9aa5b5; --line: #2c3440;
  --accent: #7ea6ff; --existing: #5c4a0f; --existing-strong: #e6b93b; --gpt: #7ea6ff;
  --good: #55c486; --unsure: #e0a73a; --bad: #ef6f62; --found: #7ea6ff; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 32px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 28px; }
h1 { font-size: 26px; margin: 0; text-wrap: balance; font-weight: 600; }
h2 { font-size: 19px; margin: 0; text-wrap: balance; font-weight: 600; }
h3 { font-size: 15px; margin: 0; font-weight: 600; }
.lede { color: var(--muted); max-width: 72ch; margin: 6px 0 0; }
.settings { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-family: var(--font-num); font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); background: var(--surface); }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .02em; vertical-align: bottom; white-space: normal; min-width: 60px; }
td:first-child, th:first-child { text-align: left; white-space: normal; min-width: 130px; }
tr.total td { font-weight: 600; }
tr.inner td:not([rowspan]) { border-bottom-style: dashed; }
td.effort, th.effort { text-align: left; }
td.effort { font-family: var(--font-num); font-size: 13px; color: var(--muted); text-align: left; }
td[rowspan] { vertical-align: top; }
.switch-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.switch { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.switch button { font: inherit; font-size: 14px; border: 0; background: none; color: var(--fg); padding: 6px 14px; cursor: pointer; }
.switch button + button { border-left: 1px solid var(--line); }
.switch button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
td .sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.g { color: var(--good); } .u { color: var(--unsure); } .b { color: var(--bad); } .f { color: var(--found); }
.post { display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); padding-top: 22px; }
.post-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.post-head a { color: var(--accent); font-size: 13px; }
.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 820px) { .lists { grid-template-columns: 1fr; } }
.list { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0; }
.item:hover, .item:focus-visible { border-color: var(--accent); outline: none; }
.item .top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-radius: 4px; padding: 1px 6px; border: 1px solid currentColor; }
.passage { font-family: var(--font-read); font-size: 14px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; overflow-wrap: anywhere; }
.notetext { overflow-wrap: anywhere; }
.comment { font-size: 13px; color: var(--fg); background: var(--bg); border-radius: 6px; padding: 6px 8px; }
.comment b { font-weight: 600; }
details.textbox > summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.reader { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; margin-top: 12px; align-items: start; }
@media (max-width: 900px) { .reader { grid-template-columns: 1fr; } }
.text { font-family: var(--font-read); font-size: 16px; line-height: 1.7; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 22px; max-height: 80vh; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 10px; }
mark { background: none; color: inherit; cursor: pointer; border-radius: 2px; }
mark.ex { background: var(--existing); }
mark.ex.helpful { box-shadow: inset 0 -2px 0 var(--existing-strong); }
mark.gp { text-decoration: underline; text-decoration-color: var(--gpt); text-decoration-thickness: 3px; text-underline-offset: 4px; }
mark.gp.nonote { text-decoration-style: dotted; }
mark.sel { outline: 2px solid var(--accent); }
.panel { position: sticky; top: env(safe-area-inset-top, 0px); max-height: 80vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.panel .empty { color: var(--muted); font-size: 13px; background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 12px; }
.sources { font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.sources a { color: var(--accent); overflow-wrap: anywhere; }
.fine { font-size: 13px; color: var(--muted); max-width: 80ch; }
.fine p { margin: 4px 0; }
@media (prefers-reduced-motion: no-preference) { .item { transition: border-color .12s; } }
</style>

<div class="wrap">
  <header>
    <h1>GPT-6.1 Terra on four posts</h1>
    <p class="lede" id="lede"></p>
    <div class="settings" id="settings"></div>
  </header>

  <section>
    <div class="tablebox"><table id="summary"></table></div>
    <div class="fine" id="tablenotes"></div>
  </section>

  <div class="switch-row"><span>Show GPT's notes from the run at</span><div class="switch" id="effort" role="group" aria-label="Reasoning effort"></div></div>
  <div id="posts"></div>
</div>

<script id="data" type="application/json">/*DATA*/</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k === "html") node.innerHTML = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined) node.append(kid);
  return node;
};
const usd = (x) => x === null || x === undefined ? "—" : "$" + x.toFixed(2);
const VERDICT_LABEL = { found: "Matches a helpful note", good: "Good", unsure: "Unsure", bad: "Bad" };
const VERDICT_CLASS = { found: "f", good: "g", unsure: "u", bad: "b" };
const FOUND_LABEL = { yes: "Found", partly: "Partly found", no: "Missed" };
const FOUND_CLASS = { yes: "g", partly: "u", no: "b" };
const WRITER_LABEL = { claude: "Claude Code", human: "Human", pipeline: "Old pipeline" };
const RATING_LABEL = { helpful: "Rated helpful", not_helpful: "Rated not helpful", needs_ratings: "Needs ratings" };
const OUTCOME_LABEL = { note: "Note", no_note_needed: "No note needed", too_hard: "Too hard" };

document.getElementById("lede").textContent = DATA.lede;
for (const s of DATA.settings) document.getElementById("settings").append(el("span", { class: "chip" }, s));

/** A post as one effort's run saw it: the notes on the site carry that run's
 *  found judgement, and the drafts are that run's. */
function atEffort(post, effort) {
  const run = post.runs[effort];
  return { ...post, ...run, existing: post.existing.map((n) => ({ ...n, ...(run.found[n.id] ?? {}) })) };
}

function counts(post) {
  const helpful = post.existing.filter((n) => n.rating === "helpful");
  const notes = post.gpt.filter((d) => d.outcome === "note");
  const by = (v) => notes.filter((d) => d.verdict === v).length;
  return {
    helpful: helpful.length, found: helpful.filter((n) => n.found === "yes").length, partly: helpful.filter((n) => n.found === "partly").length,
    notes: notes.length, matching: by("found"), good: by("good"), unsure: by("unsure"), bad: by("bad"),
    noNote: post.gpt.length - notes.length,
  };
}

function resultCells(c, run) {
  return [
    el("td", {}, `${c.found} of ${c.helpful}`, c.partly ? el("span", { class: "sub" }, `${c.partly} partly`) : null),
    el("td", {}, String(c.notes)), el("td", { class: "f" }, String(c.matching)),
    el("td", { class: "g" }, String(c.good)), el("td", { class: "u" }, String(c.unsure)), el("td", { class: "b" }, String(c.bad)),
    el("td", {}, String(c.noNote)),
    el("td", {}, usd(run.costUsd)), el("td", {}, usd(run.flexCostUsd)), el("td", {}, String(run.minutes)), el("td", {}, String(run.subagents)), el("td", {}, String(run.webSearches)),
  ];
}

const sumOf = (items, f) => items.reduce((t, x) => t + f(x), 0);
const COUNT_KEYS = ["helpful", "found", "partly", "notes", "matching", "good", "unsure", "bad", "noNote"];
const RUN_KEYS = ["costUsd", "flexCostUsd", "minutes", "subagents", "webSearches"];

/** One row per post and effort, grouped by post, then one total row per effort. */
function summaryTable() {
  const head = el("tr", {}, ["Post", "Effort", "Helpful notes found", "GPT notes", "Matching a helpful note", "Other notes: good", "Unsure", "Bad", "Researched, no note", "GPT cost", "Flex estimate", "Minutes", "Subagents", "Web searches", "Input read from cache", "Claude Code cost"].map((h) => el("th", h === "Effort" ? { class: "effort" } : {}, h)));
  const rows = DATA.posts.flatMap((post) => DATA.efforts.map((effort, i) => {
    const seen = atEffort(post, effort);
    return el("tr", { class: i === DATA.efforts.length - 1 ? "" : "inner" },
      i === 0 ? el("td", { rowspan: String(DATA.efforts.length) }, el("a", { href: "#" + post.slug, style: "color: var(--accent)" }, post.short)) : null,
      el("td", { class: "effort" }, effort),
      resultCells(counts(seen), seen.run),
      el("td", {}, Math.round(seen.run.cachedShareOfInput * 100) + "%"),
      i === 0 ? el("td", { rowspan: String(DATA.efforts.length) }, usd(post.claudeCostUsd)) : null);
  }));
  const totals = DATA.efforts.map((effort, i) => {
    const seen = DATA.posts.map((post) => atEffort(post, effort));
    const c = Object.fromEntries(COUNT_KEYS.map((k) => [k, sumOf(seen, (p) => counts(p)[k])]));
    const run = Object.fromEntries(RUN_KEYS.map((k) => [k, sumOf(seen, (p) => p.run[k])]));
    return el("tr", { class: "total" + (i === DATA.efforts.length - 1 ? "" : " inner") },
      i === 0 ? el("td", { rowspan: String(DATA.efforts.length) }, "All four") : null,
      el("td", { class: "effort" }, effort), resultCells(c, run), el("td", {}, ""), el("td", {}, ""));
  });
  document.getElementById("summary").append(el("thead", {}, head), el("tbody", {}, rows, totals));
  document.getElementById("tablenotes").append(...DATA.tableNotes.map((t) => el("p", {}, t)));
}

function existingCard(note, onPick) {
  return el("div", { class: "item", tabindex: "0", onclick: () => onPick("ex", note.id), onkeydown: (e) => e.key === "Enter" && onPick("ex", note.id) },
    el("div", { class: "top" },
      note.found ? el("span", { class: "pill " + FOUND_CLASS[note.found] }, FOUND_LABEL[note.found]) : null,
      el("span", {}, WRITER_LABEL[note.writer] + (note.author ? " (" + note.author + ")" : "")),
      el("span", {}, "· " + RATING_LABEL[note.rating] + ` · ${note.counts.h} helpful, ${note.counts.s} somewhat, ${note.counts.n} not`)),
    note.passage ? el("div", { class: "passage" }, note.passage) : null,
    el("div", { class: "notetext" }, note.note),
    note.comment ? el("div", { class: "comment" }, el("b", {}, "Judge: "), note.comment) : null);
}

function gptCard(draft, onPick) {
  return el("div", { class: "item", tabindex: "0", onclick: () => onPick("gp", draft.id), onkeydown: (e) => e.key === "Enter" && onPick("gp", draft.id) },
    el("div", { class: "top" },
      draft.verdict ? el("span", { class: "pill " + VERDICT_CLASS[draft.verdict] }, VERDICT_LABEL[draft.verdict]) : el("span", { class: "pill" }, OUTCOME_LABEL[draft.outcome]),
      el("span", {}, draft.kind.replaceAll("_", " "))),
    el("div", { class: "passage" }, draft.passage),
    draft.outcome === "note" ? el("div", { class: "notetext" }, draft.note) : null,
    draft.comment ? el("div", { class: "comment" }, el("b", {}, "Judge: "), draft.comment) : null);
}

function detailCards(draft) {
  return el("div", { class: "item" },
    el("div", { class: "top" }, el("span", {}, "GPT's reasoning")),
    el("div", { class: "fine" }, draft.reasoning),
    draft.sources.length ? el("div", { class: "sources" }, draft.sources.map((s) => el("div", {}, el("a", { href: s.url, target: "_blank", rel: "noopener" }, s.url), el("div", { class: "fine" }, "“" + s.quote + "”")))) : null);
}

/** Splits the text at every highlight edge and wraps each piece in the marks
 *  that cover it. Notes on the site get a yellow background, GPT's drafts a
 *  blue underline, so overlapping highlights stay readable. */
function renderText(post, container, onPick) {
  const spans = [
    ...post.existing.filter((n) => n.start !== null).map((n) => ({ kind: "ex", id: n.id, start: n.start, end: n.end, helpful: n.rating === "helpful" })),
    ...post.gpt.filter((d) => d.start !== null).map((d) => ({ kind: "gp", id: d.id, start: d.start, end: d.end, nonote: d.outcome !== "note" })),
  ];
  const cuts = [...new Set([0, post.text.length, ...spans.flatMap((s) => [s.start, s.end])])].sort((a, b) => a - b);
  for (let i = 0; i < cuts.length - 1; i++) {
    const [a, b] = [cuts[i], cuts[i + 1]];
    const piece = post.text.slice(a, b);
    const covering = spans.filter((s) => s.start <= a && s.end >= b);
    if (!covering.length) { container.append(piece); continue; }
    const ex = covering.filter((s) => s.kind === "ex"), gp = covering.filter((s) => s.kind === "gp");
    const cls = [ex.length ? "ex" : "", ex.some((s) => s.helpful) ? "helpful" : "", gp.length ? "gp" : "", gp.length && gp.every((s) => s.nonote) ? "nonote" : ""].filter(Boolean).join(" ");
    const mark = el("mark", { class: cls, "data-ids": covering.map((s) => s.kind + ":" + s.id).join(" ") }, piece);
    mark.addEventListener("click", () => onPick(null, null, covering));
    container.append(mark);
  }
}

function postSection(post) {
  const c = counts(post);
  const panel = el("div", { class: "panel" }, el("div", { class: "empty" }, "Click a highlighted passage to see its notes here."));
  const text = el("div", { class: "text" });
  const byId = { ex: Object.fromEntries(post.existing.map((n) => [n.id, n])), gp: Object.fromEntries(post.gpt.map((d) => [d.id, d])) };
  const textBox = el("details", { class: "textbox" }, el("summary", {}, "Show the full post with both sets of notes highlighted"),
    el("div", { class: "legend" },
      el("span", {}, el("mark", { class: "ex" }, "yellow"), " a note on the site (darker edge: rated helpful)"),
      el("span", {}, el("mark", { class: "gp" }, "underline"), " a GPT note"),
      el("span", {}, el("mark", { class: "gp nonote" }, "dotted"), " GPT checked it and wrote no note")),
    el("div", { class: "reader" }, text, panel));
  function pick(kind, id, covering) {
    const targets = covering ?? [{ kind, id }];
    panel.replaceChildren(...targets.flatMap((t) => t.kind === "ex" ? [existingCard(byId.ex[t.id], pick)] : [gptCard(byId.gp[t.id], pick), detailCards(byId.gp[t.id])]));
    text.querySelectorAll("mark.sel").forEach((m) => m.classList.remove("sel"));
    const first = targets[0];
    const marks = [...text.querySelectorAll("mark")].filter((m) => m.dataset.ids.split(" ").includes(first.kind + ":" + first.id));
    marks.forEach((m) => m.classList.add("sel"));
    if (!covering) {
      textBox.open = true;
      if (marks[0]) marks[0].scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }
  renderText(post, text, pick);
  const helpful = post.existing.filter((n) => n.rating === "helpful");
  const otherExisting = post.existing.filter((n) => n.rating !== "helpful");
  const order = { found: 0, good: 1, unsure: 2, bad: 3 };
  const notes = post.gpt.filter((d) => d.outcome === "note").sort((a, b) => order[a.verdict] - order[b.verdict]);
  const unplaced = [...post.existing, ...post.gpt].filter((x) => x.start === null).length;
  return el("section", { class: "post", id: post.slug },
    el("div", { class: "post-head" }, el("h2", {}, post.title), el("a", { href: post.url, target: "_blank", rel: "noopener" }, post.url)),
    post.summary ? el("p", { class: "fine" }, post.summary) : null,
    el("div", { class: "lists" },
      el("div", { class: "list" }, el("h3", {}, `Notes rated helpful on the site (GPT found ${c.found} of ${c.helpful})`), helpful.map((n) => existingCard(n, pick))),
      el("div", { class: "list" }, el("h3", {}, `GPT's notes (${c.notes})`), notes.map((d) => gptCard(d, pick)))),
    textBox,
    el("details", {}, el("summary", { style: "cursor:pointer;color:var(--muted)" }, `The other ${otherExisting.length} notes on the site and GPT's ${c.noNote} drafts without a note`),
      el("div", { class: "lists", style: "margin-top:10px" },
        el("div", { class: "list" }, otherExisting.map((n) => existingCard(n, pick))),
        el("div", { class: "list" }, post.gpt.filter((d) => d.outcome !== "note").map((d) => gptCard(d, pick))))),
    unplaced ? el("p", { class: "fine" }, `${unplaced} passages could not be found in the stored text and are not highlighted.`) : null);
}

/** The posts show one effort's notes at a time. The choice is remembered in
 *  this browser only. */
const EFFORT_KEY = "gpt-trial-effort";
function storedEffort() {
  try { const v = localStorage.getItem(EFFORT_KEY); return DATA.efforts.includes(v) ? v : DATA.efforts[0]; } catch { return DATA.efforts[0]; }
}
function showPosts(effort) {
  try { localStorage.setItem(EFFORT_KEY, effort); } catch {}
  document.querySelectorAll("#effort button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.effort === effort)));
  document.getElementById("posts").replaceChildren(...DATA.posts.map((post) => postSection(atEffort(post, effort))));
}

summaryTable();
document.getElementById("effort").append(...DATA.efforts.map((effort) => el("button", { type: "button", "data-effort": effort, onclick: () => showPosts(effort) }, effort + " effort")));
showPosts(storedEffort());
</script>
