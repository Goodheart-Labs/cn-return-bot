<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Common Notes icon (bold variant, thicker pill outlines): same footprint
       as icon-bold, but the pill borders are heavier and eat inward so the
       pills don't grow. Source of truth for public/icon/*.png — regenerate via
       scripts/generate-extension-icons.ts. -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="#aecdf3" stroke="#2563eb" stroke-width="11"/>
  <!-- note text lines -->
  <line x1="28" y1="38" x2="100" y2="38" stroke="#1f2937" stroke-width="13" stroke-linecap="round"/>
  <line x1="28" y1="62" x2="82" y2="62" stroke="#1f2937" stroke-width="13" stroke-linecap="round"/>
  <!-- vote pills: red / amber / green — outline widened inward, same outer size -->
  <rect x="20" y="84" width="22" height="18" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="11"/>
  <rect x="53" y="84" width="22" height="18" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="11"/>
  <rect x="86" y="84" width="22" height="18" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="11"/>
</svg>
