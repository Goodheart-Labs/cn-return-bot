<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Comparison - Ours vs Winners</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e7e9ea;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #71767b;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: #1d9bf0;
    }

    .stat-label {
      font-size: 12px;
      color: #71767b;
    }

    .comparison-list {
      max-width: 800px;
      margin: 0 auto;
    }

    .comparison-card {
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 16px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .card-header {
      padding: 16px;
      border-bottom: 1px solid #2f3336;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tweet-link {
      color: #1d9bf0;
      text-decoration: none;
      font-size: 14px;
    }

    .tweet-link:hover {
      text-decoration: underline;
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-helpful {
      background: rgba(0, 186, 124, 0.2);
      color: #00ba7c;
    }

    .status-needs-ratings {
      background: rgba(249, 24, 128, 0.2);
      color: #f91880;
    }

    .comparison-container {
      position: relative;
      min-height: 200px;
      overflow: hidden;
    }

    .note-panel {
      padding: 20px;
      min-height: 200px;
    }

    .our-note {
      background: #1a1a2e;
    }

    .winning-note {
      background: #1a2e1a;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      clip-path: inset(0 0 0 50%);
      transition: clip-path 0.05s ease-out;
    }

    .note-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .our-note .note-label {
      color: #8b5cf6;
    }

    .winning-note .note-label {
      color: #00ba7c;
    }

    .note-text {
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .note-source {
      font-size: 13px;
      color: #1d9bf0;
      word-break: break-all;
    }

    .note-id {
      font-size: 11px;
      color: #71767b;
      margin-top: 8px;
    }

    .slider-track {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #fff;
      left: 50%;
      transform: translateX(-50%);
      cursor: ew-resize;
      z-index: 10;
    }

    .slider-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      cursor: ew-resize;
    }

    .slider-handle::before {
      content: '⟷';
      font-size: 18px;
      color: #000;
    }

    .instructions {
      text-align: center;
      color: #71767b;
      font-size: 13px;
      padding: 12px;
      background: #1e1e1e;
      border-top: 1px solid #2f3336;
    }

    .multiple-winners {
      padding: 8px 16px;
      background: #2a2a2a;
      font-size: 12px;
      color: #71767b;
    }

    .winner-nav {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .winner-nav button {
      padding: 4px 12px;
      background: #2f3336;
      border: none;
      border-radius: 4px;
      color: #e7e9ea;
      cursor: pointer;
      font-size: 12px;
    }

    .winner-nav button:hover {
      background: #3f4346;
    }

    .winner-nav button.active {
      background: #1d9bf0;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #71767b;
    }

    .no-text {
      color: #71767b;
      font-style: italic;
    }

    .note-link {
      color: #1d9bf0;
      text-decoration: none;
      font-size: 12px;
      text-transform: none;
      letter-spacing: 0;
      margin-left: 8px;
    }

    .note-link:hover {
      text-decoration: underline;
    }

    .tweet-text-section {
      padding: 16px;
      background: #1c1c1c;
      border-bottom: 1px solid #2f3336;
    }

    .tweet-text-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #71767b;
      margin-bottom: 8px;
    }

    .tweet-text-content {
      font-size: 15px;
      line-height: 1.5;
      color: #e7e9ea;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Note Comparison</h1>
  <p class="subtitle">Cases where a competing note was shown instead of ours</p>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="total-comparisons">-</div>
      <div class="stat-label">Comparisons</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="total-winners">-</div>
      <div class="stat-label">Winning Notes</div>
    </div>
  </div>

  <div class="comparison-list" id="comparison-list">
    <div class="loading">Loading data...</div>
  </div>

  <script>
    // Supabase config - will need to be filled in or loaded
    const SUPABASE_URL = 'https://ugytvkevhsmcpunfvncw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVneXR2a2V2aHNtY3B1bmZ2bmN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NjQ0NjEsImV4cCI6MjA4MzM0MDQ2MX0.usre2NRqCKhQi80gtIq-8O7AZbzWvHv5V8ZFkZkeGus';

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function fetchData() {
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      };

      // Fetch our notes
      const notesRes = await fetch(`${SUPABASE_URL}/rest/v1/notes?select=note_id,tweet_id,note_text,source_url,cn_status,bot_name`, { headers });
      const ourNotes = await notesRes.json();

      // Fetch snapshots
      const snapshotsRes = await fetch(`${SUPABASE_URL}/rest/v1/public_data_snapshots?select=tweet_id,note_id,current_status,is_ours,note_text`, { headers });
      const snapshots = await snapshotsRes.json();

      // Fetch tweet text from pipeline_runs
      const pipelineRes = await fetch(`${SUPABASE_URL}/rest/v1/pipeline_runs?select=tweet_id,tweet_text`, { headers });
      const pipelineRuns = await pipelineRes.json();

      // Build tweet_id -> tweet_text map
      const tweetTextMap = {};
      for (const run of pipelineRuns) {
        if (run.tweet_text) {
          tweetTextMap[run.tweet_id] = run.tweet_text;
        }
      }

      return { ourNotes, snapshots, tweetTextMap };
    }

    async function fetchWinningNoteText(noteId) {
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      };

      // Check scraped_notewriter_notes first
      const res = await fetch(`${SUPABASE_URL}/rest/v1/scraped_notewriter_notes?note_id=eq.${noteId}&select=note_text,source_url`, { headers });
      const data = await res.json();

      if (data && data.length > 0) {
        return data[0];
      }

      // Also try with tweet_ prefix format
      const res2 = await fetch(`${SUPABASE_URL}/rest/v1/scraped_notewriter_notes?note_id=eq.tweet_${noteId}&select=note_text,source_url`, { headers });
      const data2 = await res2.json();

      if (data2 && data2.length > 0) {
        return data2[0];
      }

      return null;
    }

    function processData(ourNotes, snapshots, tweetTextMap) {
      const tweetData = {};

      for (const note of ourNotes) {
        if (!tweetData[note.tweet_id]) {
          tweetData[note.tweet_id] = { ours: null, competing: [], tweet_text: tweetTextMap[note.tweet_id] || null };
        }
        tweetData[note.tweet_id].ours = note;
      }

      for (const snap of snapshots) {
        if (!snap.is_ours && tweetData[snap.tweet_id]) {
          tweetData[snap.tweet_id].competing.push({
            ...snap,
            note_text: snap.note_text || null
          });
        }
      }

      const comparisons = [];
      for (const [tweetId, data] of Object.entries(tweetData)) {
        const helpfulCompeting = data.competing.filter(c => c.current_status === 'CURRENTLY_RATED_HELPFUL');
        const ourStatus = data.ours?.cn_status;

        if (helpfulCompeting.length > 0 && ourStatus !== 'CURRENTLY_RATED_HELPFUL') {
          comparisons.push({
            tweet_id: tweetId,
            our_note: data.ours,
            winning_notes: helpfulCompeting,
            tweet_text: data.tweet_text
          });
        }
      }

      return comparisons;
    }

    function createComparisonCard(comparison, index) {
      const card = document.createElement('div');
      card.className = 'comparison-card';
      card.dataset.index = index;

      const hasMultipleWinners = comparison.winning_notes.length > 1;

      card.innerHTML = `
        <div class="card-header">
          <a href="https://x.com/i/status/${comparison.tweet_id}" target="_blank" class="tweet-link">
            View Tweet ↗
          </a>
          <span class="status-badge status-needs-ratings">${comparison.our_note.cn_status || 'Unknown'}</span>
        </div>
        ${comparison.tweet_text ? `
          <div class="tweet-text-section">
            <div class="tweet-text-label">Original Tweet</div>
            <div class="tweet-text-content">${escapeHtml(comparison.tweet_text)}</div>
          </div>
        ` : ''}
        ${hasMultipleWinners ? `
          <div class="multiple-winners">
            ${comparison.winning_notes.length} winning notes on this tweet
            <div class="winner-nav">
              ${comparison.winning_notes.map((w, i) => `
                <button class="${i === 0 ? 'active' : ''}" data-winner-index="${i}">Winner ${i + 1}</button>
              `).join('')}
            </div>
          </div>
        ` : ''}
        <div class="comparison-container">
          <div class="note-panel our-note">
            <div class="note-label">📝 Our Note (${comparison.our_note.bot_name || 'bot'})</div>
            <div class="note-text">${comparison.our_note.note_text || '<span class="no-text">No text available</span>'}</div>
            ${comparison.our_note.source_url ? `<div class="note-source">${comparison.our_note.source_url}</div>` : ''}
            <div class="note-id">ID: ${comparison.our_note.note_id}</div>
          </div>
          <div class="note-panel winning-note" data-winner-index="0">
            <div class="note-label">🏆 Winning Note <a href="https://x.com/i/birdwatch/n/${comparison.winning_notes[0].note_id}" target="_blank" class="note-link">View on X ↗</a></div>
            <div class="note-text winning-text">${comparison.winning_notes[0].note_text ? escapeHtml(comparison.winning_notes[0].note_text) : '<span class="no-text">Loading...</span>'}</div>
            <div class="note-source winning-source"></div>
            <div class="note-id">ID: ${comparison.winning_notes[0].note_id}</div>
          </div>
          <div class="slider-track">
            <div class="slider-handle"></div>
          </div>
        </div>
        <div class="instructions">← Drag slider to compare notes →</div>
      `;

      // Load winning note text if not already available from snapshot
      if (!comparison.winning_notes[0].note_text) {
        loadWinningNoteText(card, comparison.winning_notes[0].note_id);
      }

      // Setup slider
      setupSlider(card);

      // Setup winner navigation if multiple
      if (hasMultipleWinners) {
        const buttons = card.querySelectorAll('.winner-nav button');
        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            const winnerIndex = parseInt(btn.dataset.winnerIndex);
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const winningPanel = card.querySelector('.winning-note');
            const winner = comparison.winning_notes[winnerIndex];
            winningPanel.querySelector('.note-id').textContent = `ID: ${winner.note_id}`;
            winningPanel.querySelector('.note-link').href = `https://x.com/i/birdwatch/n/${winner.note_id}`;
            winningPanel.querySelector('.winning-source').textContent = '';

            if (winner.note_text) {
              winningPanel.querySelector('.winning-text').textContent = winner.note_text;
            } else {
              winningPanel.querySelector('.winning-text').innerHTML = '<span class="no-text">Loading...</span>';
              loadWinningNoteText(card, winner.note_id);
            }
          });
        });
      }

      return card;
    }

    async function loadWinningNoteText(card, noteId) {
      const winningPanel = card.querySelector('.winning-note');
      const textEl = winningPanel.querySelector('.winning-text');
      const sourceEl = winningPanel.querySelector('.winning-source');

      const data = await fetchWinningNoteText(noteId);

      if (data && data.note_text) {
        textEl.textContent = data.note_text;
        if (data.source_url) {
          sourceEl.textContent = data.source_url;
        }
      } else {
        textEl.innerHTML = '<span class="no-text">Note text not in our database - view on X to see</span>';
      }
    }

    function setupSlider(card) {
      const container = card.querySelector('.comparison-container');
      const winningNote = card.querySelector('.winning-note');
      const slider = card.querySelector('.slider-track');

      let isDragging = false;

      function updatePosition(clientX) {
        const rect = container.getBoundingClientRect();
        let percentage = ((clientX - rect.left) / rect.width) * 100;
        percentage = Math.max(0, Math.min(100, percentage));

        winningNote.style.clipPath = `inset(0 0 0 ${percentage}%)`;
        slider.style.left = `${percentage}%`;
      }

      slider.addEventListener('mousedown', (e) => {
        isDragging = true;
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (isDragging) {
          updatePosition(e.clientX);
        }
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
      });

      // Touch support
      slider.addEventListener('touchstart', (e) => {
        isDragging = true;
        e.preventDefault();
      });

      document.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches[0]) {
          updatePosition(e.touches[0].clientX);
        }
      });

      document.addEventListener('touchend', () => {
        isDragging = false;
      });
    }

    async function init() {
      try {
        const { ourNotes, snapshots, tweetTextMap } = await fetchData();
        const comparisons = processData(ourNotes, snapshots, tweetTextMap);

        document.getElementById('total-comparisons').textContent = comparisons.length;
        document.getElementById('total-winners').textContent = comparisons.reduce((sum, c) => sum + c.winning_notes.length, 0);

        const list = document.getElementById('comparison-list');
        list.innerHTML = '';

        if (comparisons.length === 0) {
          list.innerHTML = '<div class="loading">No comparisons found - either all our notes won, or no competing notes are helpful yet!</div>';
          return;
        }

        comparisons.forEach((comparison, index) => {
          list.appendChild(createComparisonCard(comparison, index));
        });
      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('comparison-list').innerHTML = `<div class="loading">Error loading data: ${error.message}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
