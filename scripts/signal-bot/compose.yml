# Linux deployment beside an existing signal-cli-rest-api bridge on localhost.
# This project defines only the new worker; it does not manage the gym services.
name: cn-signal-worker
services:
  worker:
    image: cn-signal-worker:local
    build:
      context: ../..
      dockerfile: scripts/signal-bot/Dockerfile
    hostname: cn-signal-worker
    network_mode: host
    env_file:
      - path: ${CN_SIGNAL_ENV_FILE:-/opt/cn-return-bot/config/signal.env}
        format: raw
    environment:
      SIGNAL_API_URL: http://127.0.0.1:8080
      SIGNAL_STATE_PATH: /state/signal-bot.sqlite
    volumes:
      - type: bind
        source: ${CN_SIGNAL_STATE_DIR:-/opt/cn-return-bot/state}
        target: /state
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 10m
    init: true
    shm_size: 256m
    mem_limit: 2g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
